name: Mobile iOS (TestFlight)

# Builds the iOS app on a GitHub macOS runner (eas build --local: free for this public repo, and it doesn't use
# the Expo free plan's monthly iOS build allowance) and uploads it to TestFlight. Run by hand. "expo_servers"
# builds on Expo's Macs instead (counts against that allowance). Secrets: EXPO_TOKEN (expo.dev access token), the App Store Connect API key as either
# ASC_API_KEY_P8 (the .p8 file's text) or ASC_KEY_P8_BASE64 (the file in base64), ASC_KEY_ID, ASC_ISSUER_ID,
# APPLE_TEAM_ID.
on:
  workflow_dispatch:
    inputs:
      setup_credentials:
        description: "First time only: create the signing certificate and profiles (answers EAS's questions)"
        type: boolean
        default: false
      status_only:
        description: "Don't build or submit: show the latest builds and TestFlight submissions"
        type: boolean
        default: false
      submit_only:
        description: "Don't build: upload the latest finished EAS build to TestFlight"
        type: boolean
        default: false
      expo_servers:
        description: "Build on Expo's servers (EAS Build) instead of a GitHub Mac; uses the Expo plan's iOS builds"
        type: boolean
        default: false

concurrency:
  group: mobile-ios
  cancel-in-progress: false

jobs:
  # The usual path: build on a GitHub Mac, then upload to TestFlight.
  mac:
    if: ${{ !inputs.status_only && !inputs.submit_only && !inputs.setup_credentials && !inputs.expo_servers }}
    # The macOS 26 runner has the newest Xcode (Expo's own servers use Xcode 27 for SDK 58).
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: "1"
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-native-peers.mjs

      # App Store uploads must be built with a current Xcode: use the newest one on the runner.
      - name: Pick Xcode
        run: |
          ls -d /Applications/Xcode*.app
          x=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$x"
          xcodebuild -version
          # Expo's own servers build SDK 58 with Xcode 27; 26.3 failed on a Swift concurrency check, newer may not.
          case "$(xcodebuild -version | head -1)" in
            "Xcode 2"[0-6]*) echo "::warning::Building with $(xcodebuild -version | head -1); Expo builds SDK 58 with Xcode 27" ;;
          esac
          command -v fastlane >/dev/null || brew install fastlane
          pod --version

      - name: Signing key and project ids
        working-directory: apps/mobile
        run: |
          node scripts/asc-setup.mjs "$RUNNER_TEMP/asc.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"
          EXPO_ASC_API_KEY_PATH="$RUNNER_TEMP/asc.p8" node scripts/ios-ids.mjs

      # Signing certificate and profile come from EAS (made once with setup_credentials); the build number
      # is bumped there too (appVersionSource: remote).
      - name: Build
        working-directory: apps/mobile
        run: npx --yes eas-cli@27 build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/wanderbar.ipa"

      - name: Upload to TestFlight
        working-directory: apps/mobile
        run: npx --yes eas-cli@27 submit --platform ios --profile production --path "$RUNNER_TEMP/wanderbar.ipa" --non-interactive --wait

  # Status, a resubmit, first-time signing setup, or a build on Expo's servers.
  build:
    if: ${{ inputs.status_only || inputs.submit_only || inputs.setup_credentials || inputs.expo_servers }}
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A native package the app doesn't list itself isn't linked and crashes the app when used.
      - run: node scripts/check-native-peers.mjs

      - name: Check setup
        run: |
          missing=""
          for v in EXPO_TOKEN ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -n "$ASC_API_KEY_P8$ASC_KEY_P8_BASE64" ] || missing="$missing ASC_API_KEY_P8 (or ASC_KEY_P8_BASE64)"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # The App Store Connect API key lets EAS create the signing certificate and profiles and upload to TestFlight
      # without an interactive Apple login.
      - name: Build on EAS and submit to TestFlight
        working-directory: apps/mobile
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: |
          node scripts/asc-setup.mjs "$RUNNER_TEMP/asc.p8"
          export EXPO_ASC_API_KEY_PATH="$RUNNER_TEMP/asc.p8"
          # Expo project (created on first run) and the App Store Connect app id, filled in for this build.
          node scripts/ios-ids.mjs
          if [ "${{ inputs.status_only }}" = "true" ]; then
            node scripts/eas-status.mjs
          elif [ "${{ inputs.submit_only }}" = "true" ]; then
            node scripts/eas-status.mjs || true
            npx --yes eas-cli@27 submit --platform ios --profile production --latest --non-interactive --wait || { node scripts/eas-status.mjs; exit 1; }
          elif [ "${{ inputs.setup_credentials }}" = "true" ]; then
            # EAS only creates the distribution certificate and provisioning profiles interactively. Run it under
            # a terminal and accept every question; the App Store Connect API key stands in for an Apple login.
            sudo apt-get install -y expect >/dev/null
            npm i -g eas-cli@27 >/dev/null
            expect ../../scripts/eas-ios-setup.exp
          else
            npx --yes eas-cli@27 build --platform ios --profile production --non-interactive --auto-submit --no-wait
          fi
