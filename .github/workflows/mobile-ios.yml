name: Mobile iOS (TestFlight)

# Builds on Expo's Macs (EAS Build) and submits to TestFlight. Run by hand: the free Expo plan has a monthly
# iOS build allowance. Secrets: EXPO_TOKEN (expo.dev access token), ASC_API_KEY_P8 (App Store Connect API key
# file contents), ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID.
on:
  workflow_dispatch:

concurrency:
  group: mobile-ios
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check setup
        run: |
          missing=""
          for v in EXPO_TOKEN ASC_API_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          grep -q REPLACE_WITH apps/mobile/app.config.ts apps/mobile/eas.json && missing="$missing (Expo project ID / owner / ascAppId in the repo)"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # The App Store Connect API key lets EAS create the signing certificate and profiles and upload to TestFlight
      # without an interactive Apple login.
      - name: Build on EAS and submit to TestFlight
        working-directory: apps/mobile
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          export EXPO_ASC_API_KEY_PATH="$RUNNER_TEMP/asc.p8"
          npx --yes eas-cli@27 build --platform ios --profile production --non-interactive --auto-submit --no-wait
