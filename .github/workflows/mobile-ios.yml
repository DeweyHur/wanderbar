name: Mobile iOS (TestFlight)

# Builds on Expo's Macs (EAS Build) and submits to TestFlight. Run by hand: the free Expo plan has a monthly
# iOS build allowance. Secrets: EXPO_TOKEN (expo.dev access token), the App Store Connect API key as either
# ASC_API_KEY_P8 (the .p8 file's text) or ASC_KEY_P8_BASE64 (the file in base64), ASC_KEY_ID, ASC_ISSUER_ID,
# APPLE_TEAM_ID.
on:
  workflow_dispatch:
    inputs:
      setup_credentials:
        description: "First time only: create the signing certificate and profiles (answers EAS's questions)"
        type: boolean
        default: false
      status_only:
        description: "Don't build or submit: show the latest builds and TestFlight submissions"
        type: boolean
        default: false
      submit_only:
        description: "Don't build: upload the latest finished EAS build to TestFlight"
        type: boolean
        default: false

concurrency:
  group: mobile-ios
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A native package the app doesn't list itself isn't linked and crashes the app when used.
      - run: node scripts/check-native-peers.mjs

      - name: Check setup
        run: |
          missing=""
          for v in EXPO_TOKEN ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -n "$ASC_API_KEY_P8$ASC_KEY_P8_BASE64" ] || missing="$missing ASC_API_KEY_P8 (or ASC_KEY_P8_BASE64)"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # The App Store Connect API key lets EAS create the signing certificate and profiles and upload to TestFlight
      # without an interactive Apple login.
      - name: Build on EAS and submit to TestFlight
        working-directory: apps/mobile
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: |
          # The key as the .p8 text, or base64 of it (standard or URL-safe, with or without line breaks).
          node -e '
            const raw = (process.env.ASC_API_KEY_P8 || process.env.ASC_KEY_P8_BASE64 || "").trim();
            let pem = raw.includes("BEGIN PRIVATE KEY") ? raw : Buffer.from(raw.replace(/\s+/g, "").replace(/-/g, "+").replace(/_/g, "/"), "base64").toString("utf8");
            if (!pem.includes("BEGIN PRIVATE KEY")) {
              const der = Buffer.from(raw.replace(/\s+/g, ""), "base64");
              // base64 of the binary (DER) key rather than of the .p8 text
              if (der[0] === 0x30) pem = "-----BEGIN PRIVATE KEY-----\n" + der.toString("base64").match(/.{1,64}/g).join("\n") + "\n-----END PRIVATE KEY-----";
              else pem = Buffer.from(pem.replace(/\s+/g, ""), "base64").toString("utf8");
            }
            if (!pem.includes("BEGIN PRIVATE KEY")) { console.error("::error::The App Store Connect key is not a .p8 private key (or base64 of one)"); process.exit(1); }
            require("fs").writeFileSync(process.argv[1], pem.trim() + "\n");
          ' "$RUNNER_TEMP/asc.p8"
          export EXPO_ASC_API_KEY_PATH="$RUNNER_TEMP/asc.p8"
          # Expo project (created on first run) and the App Store Connect app id, filled in for this build.
          node scripts/ios-ids.mjs
          # The TestFlight upload uses the same key (EAS won't store one for submit non-interactively).
          node -e '
            const f = "eas.json", j = JSON.parse(require("fs").readFileSync(f, "utf8"));
            Object.assign(j.submit.production.ios, { ascApiKeyPath: process.env.EXPO_ASC_API_KEY_PATH, ascApiKeyIssuerId: process.env.EXPO_ASC_ISSUER_ID, ascApiKeyId: process.env.EXPO_ASC_KEY_ID });
            require("fs").writeFileSync(f, JSON.stringify(j, null, 2));
          '
          if [ "${{ inputs.status_only }}" = "true" ]; then
            node scripts/eas-status.mjs
          elif [ "${{ inputs.submit_only }}" = "true" ]; then
            node scripts/eas-status.mjs || true
            npx --yes eas-cli@27 submit --platform ios --profile production --latest --non-interactive --wait || { node scripts/eas-status.mjs; exit 1; }
          elif [ "${{ inputs.setup_credentials }}" = "true" ]; then
            # EAS only creates the distribution certificate and provisioning profiles interactively. Run it under
            # a terminal and accept every question; the App Store Connect API key stands in for an Apple login.
            sudo apt-get install -y expect >/dev/null
            npm i -g eas-cli@27 >/dev/null
            expect ../../scripts/eas-ios-setup.exp
          else
            npx --yes eas-cli@27 build --platform ios --profile production --non-interactive --auto-submit --no-wait
          fi
