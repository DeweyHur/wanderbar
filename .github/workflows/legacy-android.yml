name: Legacy Android (Kotlin) build

on:
  push:
    branches: [main]
    paths: ["legacy-android/**", ".github/workflows/legacy-android.yml"]
  pull_request:
    paths: ["legacy-android/**", ".github/workflows/legacy-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: legacy-android/app/build/reports/
          if-no-files-found: ignore

      # The APK embeds the Android Google key, so it is not published (releases/artifacts) while the
      # repository is public. Distribution: see README.
