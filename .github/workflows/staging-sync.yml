name: Keep staging in step with main

# The staging site (wanderbar-staging.vercel.app) is the Vercel preview of the `staging` branch,
# running on a Neon branch copied from production, with passwordless test sign-in. Every push to
# main moves `staging` to the same commit so the staging site always runs what production runs,
# and (when the NEON_API_KEY secret is set) resets the staging database to production's current
# data and schema, so new migrations reach staging too. Test data on staging is thrown away.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push --force origin HEAD:refs/heads/staging
      - name: Reset the staging database from production
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        if: env.NEON_API_KEY != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $NEON_API_KEY" -H "Content-Type: application/json" -d '{}' \
            https://console.neon.tech/api/v2/projects/late-sky-25700084/branches/br-crimson-mode-b8knfuy9/reset_to_parent \
            -o /dev/null
