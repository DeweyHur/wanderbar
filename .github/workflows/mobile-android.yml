name: Mobile Android APK

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/**", "package-lock.json", "scripts/android-smoke.sh", ".github/workflows/mobile-android.yml"]
  workflow_dispatch:
    inputs:
      play:
        description: "Build the Play Store bundle (AAB, signed with the EAS upload key) instead of the test APK"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mobile-android
  cancel-in-progress: true

jobs:
  # Google Play: an app bundle signed with the upload key EAS keeps (made on first run), built here on
  # the runner. Goes to the internal testing track when the Play service account secret is set, and
  # always to a private draft release too (for a manual upload).
  play:
    if: inputs.play
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: node scripts/check-native-peers.mjs
      - name: Firebase config
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json
          echo "GOOGLE_SERVICES_FILE=$PWD/google-services.json" >> "$GITHUB_ENV"
      - name: Build the app bundle
        working-directory: apps/mobile
        run: npx --yes eas-cli@27 build --platform android --profile production --local --non-interactive --output "$GITHUB_WORKSPACE/wanderbar.aab"
      - name: Upload key fingerprint
        working-directory: apps/mobile
        run: npx --yes eas-cli@27 credentials:configure-build --platform android --profile production --non-interactive 2>&1 | tail -20 || true
      # Straight to the Play internal testing track once the PLAY_SERVICE_ACCOUNT_JSON secret is set
      # (a service account invited in Play Console with "release to testing tracks" on Wanderbar only).
      - name: Upload to Play internal testing
        id: play_upload
        env:
          HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        if: env.HAS_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.wanderbar.mobile
          releaseFiles: wanderbar.aab
          releaseName: "${{ github.run_number }} (${{ github.sha }})"
          track: internal
          status: completed
      - name: Private draft release with the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api repos/${{ github.repository }}/releases --jq '.[] | select(.draft and ((.name // "") | startswith("wanderbar play"))) | .id'); do
            gh api -X DELETE repos/${{ github.repository }}/releases/$id
          done
          gh release create "play-build-$GITHUB_RUN_NUMBER" wanderbar.aab --draft --target "$GITHUB_SHA" \
            --title "wanderbar play bundle (run #$GITHUB_RUN_NUMBER, draft)" \
            --notes "Google Play app bundle of ${GITHUB_SHA::7}. Draft: only visible to the repo owner."

  build:
    if: ${{ !inputs.play }}
    runs-on: ubuntu-latest
    env:
      # Public values baked into the JS bundle (not secrets).
      EXPO_PUBLIC_API_URL: https://wanderbar-api.vercel.app
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 380806659421-rq02568pp8sulkud63v18aes4hqt535t.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 380806659421-3mm0vt3bm7dilljkrc5eogg220oak45o.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_IOS_URL_SCHEME: com.googleusercontent.apps.380806659421-3mm0vt3bm7dilljkrc5eogg220oak45o
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
      # Android-restricted Google key (Maps SDK, Places, Routes), same secret the old Kotlin app used.
      EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # A native package the app doesn't list itself isn't linked and crashes the app when used.
      - run: node scripts/check-native-peers.mjs

      # Firebase config for push (group news), kept out of git. Without the secret the app builds without push.
      - name: Firebase config
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json
            echo "GOOGLE_SERVICES_FILE=./google-services.json" >> "$GITHUB_ENV"
          fi

      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # Release build = JS bundled inside, no dev server needed. The Expo template signs release
      # with its debug keystore (SHA-1 5E:8F:16:...:F6:25), the one registered for Google sign-in.
      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleRelease


      # Smoke test on an emulator: install, launch, receive a share; fails (with the crash as an annotation) if
      # the app dies. The APK never leaves this job.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test
        id: smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./scripts/android-smoke.sh apps/mobile/android/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: android-smoke/
          if-no-files-found: ignore

      # Hand the tested APK to the owner through a DRAFT release: drafts are visible only to people with
      # write access, so the APK (which embeds the Android map key) stays out of public view.
      - name: Update the private draft release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk wanderbar-mobile.apk
          for id in $(gh api repos/${{ github.repository }}/releases --jq '.[] | select(.draft and ((.name // "") | startswith("wanderbar mobile"))) | .id'); do
            gh api -X DELETE repos/${{ github.repository }}/releases/$id
          done
          gh release create "mobile-build-$GITHUB_RUN_NUMBER" wanderbar-mobile.apk \
            --draft \
            --target "$GITHUB_SHA" \
            --title "wanderbar mobile (build #$GITHUB_RUN_NUMBER, draft)" \
            --notes "Release build of ${GITHUB_SHA::7}, passed the emulator smoke test. Draft: only visible to the repo owner."
