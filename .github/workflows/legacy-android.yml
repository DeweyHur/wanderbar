name: Legacy Android (Kotlin) build

on:
  push:
    branches: [main]
    paths: ["legacy-android/**", ".github/workflows/legacy-android.yml"]
  pull_request:
    paths: ["legacy-android/**", ".github/workflows/legacy-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wanderbar-debug-apk
          path: legacy-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: legacy-android/app/build/reports/
          if-no-files-found: ignore

      - name: Publish to "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk wanderbar.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest wanderbar.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "wanderbar (build #$GITHUB_RUN_NUMBER)" \
            --notes "Debug build of ${GITHUB_SHA::7}. Install: https://github.com/${{ github.repository }}/releases/download/latest/wanderbar.apk"
